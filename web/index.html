<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="World, China and Australia headlines paired with a related Bible verse and reflection.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#2E8C5A">
  <meta name="apple-mobile-web-app-title" content="News Insight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>News Insight</title>
  <script id="zh-title-switch">
    // Home-screen/app title follows the reader's language, like the
    // native builds: 新闻洞见 for Chinese UIs, News Insight otherwise.
    if ((navigator.language || '').toLowerCase().startsWith('zh')) {
      document.title = '新闻洞见';
    }
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    2026-08-06: the app used to boot to a blank white page while
    main.dart.js downloaded — several seconds on a cold load, with
    nothing on screen to say anything was happening.

    This splash is plain HTML on purpose. A Flutter loading page cannot
    help here: it only appears once the framework is already up, which
    is the part that takes the time. This paints on the first byte, and
    removes itself on Flutter's first frame.
  -->
  <div id="boot" aria-hidden="true">
    <div class="mark">
      <img src="icons/Icon-512.png" alt="" width="512" height="512">
    </div>
    <div class="t">News Insight</div>
    <div class="z">新闻洞见</div>
    <div class="v">v__APP_VERSION__</div>
  </div>
  <style>
    /* The icon scales with the viewport. A fixed pixel size is right on
       exactly one screen and wrong everywhere else — 88px looked fine
       on a phone and lost on a 27" monitor. vmin ties it to the smaller
       axis so it behaves in landscape too; the clamp keeps it sane at
       both extremes. */
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:#BCE8CC;color:#1E5E3C;z-index:9999;
      font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",
        system-ui,sans-serif;
      /* Fade the splash IN, so a warm cache that boots in 100ms never
         flashes it. An instant flash reads as a glitch. */
      opacity:0;animation:boot-in .32s ease .18s forwards;
      transition:opacity .3s ease}
    #boot .mark{width:clamp(148px,28vmin,208px);aspect-ratio:1;
      border-radius:22%;overflow:hidden;
      box-shadow:0 10px 30px rgba(26,88,142,.28);
      /* Slow breathing. Without motion a splash cannot be told apart
         from a frozen app — this signals "working", which matters more
         than how large the icon is. */
      animation:boot-breathe 2.4s ease-in-out .5s infinite}
    #boot .mark img{width:100%;height:100%;display:block}
    #boot .t{margin-top:clamp(18px,3vmin,26px);
      font-size:clamp(19px,2.6vmin,23px);font-weight:600;
      letter-spacing:.01em}
    #boot .z{margin-top:3px;font-size:clamp(13px,1.8vmin,15px);
      color:#2E8C5A;letter-spacing:.26em;text-indent:.26em}
    /* Version is metadata, not identity — pinned low, out of the
       lockup, where it informs without competing. */
    #boot .v{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));
      font-size:11px;opacity:.45;font-variant-numeric:tabular-nums;
      letter-spacing:.04em}
    #boot.gone{opacity:0;pointer-events:none}
    @keyframes boot-in{to{opacity:1}}
    @keyframes boot-breathe{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.045)}}
    @media (prefers-color-scheme: dark){
      #boot{background:#0E2438;color:#CBE4F5}
      #boot .z{color:#7FB4DC}
      #boot .mark{box-shadow:0 10px 30px rgba(0,0,0,.5)}}
    /* Someone who has asked for less motion gets the splash without
       the pulse — they still get the fade, which is not vestibular. */
    @media (prefers-reduced-motion: reduce){
      #boot .mark{animation:none}}
  </style>
  <script>
    (function () {
      function dismiss() {
        var b = document.getElementById('boot');
        if (!b) return;
        b.classList.add('gone');
        setTimeout(function () { b.remove(); }, 320);
      }
      window.addEventListener('flutter-first-frame', dismiss);
      // A floor, not the mechanism. If the first-frame event never
      // fires, the splash must not trap the reader behind it.
      setTimeout(dismiss, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
